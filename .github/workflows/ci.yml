name: CI

# 什么时候触发: 推到 main, 或对 main 提 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试 (Python 3.12 + MySQL 8 + Redis 7)
    runs-on: ubuntu-latest

    # 测试需要真实的 MySQL 和 Redis, 用 GitHub 的 service containers 起
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: learn_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # 这些环境变量会被 app/core/config.py 读到(没有 .env 时就用它们)
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DATABASE: learn_mysql
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_SECRET: ci-secret-must-be-at-least-32-bytes-long
      PYTHONIOENCODING: utf-8

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: 装依赖
        working-directory: project
        run: pip install -r requirements.txt

      - name: 语法检查
        working-directory: project
        run: python -m compileall -q app tests migrations

      - name: 建表(执行迁移)
        working-directory: project
        run: alembic upgrade head

      - name: 跑测试
        working-directory: project
        run: python -m pytest tests -q

      - name: 确认迁移无漂移
        working-directory: project
        run: alembic check
