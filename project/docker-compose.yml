# 一条命令起整套环境: MySQL + Redis + 应用
#
#   docker compose up -d --build
#   docker compose logs -f app
#   docker compose down          # 停掉, 数据保留在 volume 里
#   docker compose down -v       # 停掉并删掉数据
#
# 端口说明: 宿主机上的 3307 / 6380 / 8000
#   本机可能已经有 MySQL(3306) 和 Redis(6379), 所以宿主机端口错开一位,
#   容器内部端口不变(3306 / 6379), 应用连的是容器名.

services:
  mysql:
    image: mysql:8.0
    container_name: pbn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: learn_mysql
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pbn-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pbn-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: learn_mysql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: dev-secret-change-me-please-0123456789
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 先跑迁移建表, 再起服务
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  mysqldata:
